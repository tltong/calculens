<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calculens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
    }

    .section {
      margin-top: 20px;
    }

    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: #1f6fff;
      color: white;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .output {
      margin-top: 16px;
      background: #111827;
      color: #f9fafb;
      border-radius: 8px;
      padding: 14px;
      white-space: pre-wrap;
      min-height: 80px;
      font-size: 13px;
    }

    a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="section">
    <a href="/pages/admin/admin.html?v=admin-access-1">
      <button>Go to Admin Users</button>
    </a>
  </div>

  <div class="section">
    <strong>Output:</strong>
    <div id="output-box" class="output">Initializing Firebase...</div>
  </div>

  <script type="module">
    import { initFirebase } from "/utils/firebase/firebase.js";
    import {
      initFirestore
    } from "/utils/firebase/firebase_ops.js";

    const outputBox = document.getElementById("output-box");

    function setOutput(data) {
      outputBox.textContent =
        typeof data === "string" ? data : JSON.stringify(data, null, 2);
    }

    async function initializeApp() {
      try {
        initFirebase();
        initFirestore();

        setOutput("Firebase and Firestore initialized successfully.");
      } catch (error) {
        console.error(error);
        setOutput({
          success: false,
          message: "Firebase initialization failed",
          error: error.message
        });
      }
    }

    initializeApp();
  </script>
</body>
</html>
